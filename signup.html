<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Customer Account — Subly Nigeria</title>
  <meta name="description" content="Create your free Subly account for 1-click subscription orders, instant renewals, and warranty tracking." />
  <link rel="canonical" href="https://subly.store/signup.html" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://subly.store/signup.html" />
  <meta property="og:title" content="Create Customer Account — Subly Nigeria" />
  <meta property="og:description" content="Join Subly for fast digital subscriptions and 1-click WhatsApp order fulfillment." />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="auth-page-body">
  
  <!-- Background Glows -->
  <div class="flyer-bg-ambient">
    <div class="bg-glow-spot glow-spot-1"></div>
    <div class="bg-glow-spot glow-spot-2"></div>
  </div>

  <!-- Minimal Auth Header -->
  <header class="auth-top-header">
    <div class="nav-container" style="justify-content: space-between;">
      <a href="index.html" class="nav-brand" aria-label="Subly Home">
        <div class="brand-logo-group">
          <div class="brand-mark-box">
            <svg viewBox="0 0 48 48" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
                <rect x="9" y="13" width="22" height="10" rx="5" transform="rotate(-32 9 13)" fill="#22C55E"/>
                <rect x="22" y="24" width="22" height="10" rx="5" transform="rotate(-32 22 24)" fill="#15803D"/>
              </svg>
          </div>
          <span class="brand-name">subly</span>
        </div>
      </a>

      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="index.html" class="btn btn-secondary btn-sm">Storefront &rarr;</a>
      </div>
    </div>
  </header>

  <!-- Main Auth Container -->
  <main class="auth-main-wrapper">
    <div class="customer-auth-card" style="max-width: 480px;">
      <div class="auth-card-icon-circle">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#16A34A" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      </div>

      <h1 class="auth-card-title">Create Your Account</h1>
      <p class="auth-card-subtitle">Save your billing details for instant 1-click checkout and renewal tracking.</p>

      <form id="customer-signup-form" onsubmit="return false;" class="auth-form-body">
        
        <div class="compact-grid-2">
          <div class="form-group-compact" style="margin-bottom: 14px;">
            <label for="signup-name" class="compact-label">Full Name / Nickname *</label>
            <input type="text" id="signup-name" class="form-control-compact" placeholder="e.g. Chidi Okafor" maxlength="60" autocomplete="name" required autofocus />
          </div>

          <div class="form-group-compact" style="margin-bottom: 14px;">
            <label for="signup-whatsapp" class="compact-label">WhatsApp Number *</label>
            <input type="tel" id="signup-whatsapp" class="form-control-compact" placeholder="e.g. 08012345678" maxlength="20" autocomplete="tel" required />
          </div>
        </div>

        <div class="form-group-compact" style="margin-bottom: 14px;">
          <label for="signup-email" class="compact-label">Email Address (Optional)</label>
          <input type="email" id="signup-email" class="form-control-compact" placeholder="e.g. user@gmail.com" maxlength="80" autocomplete="email" />
        </div>

        <div class="form-group-compact" style="margin-bottom: 16px;">
          <label for="signup-password" class="compact-label">Create Password (min 4 characters) *</label>
          <input type="password" id="signup-password" class="form-control-compact" placeholder="Choose a secure password" maxlength="40" autocomplete="new-password" required />
        </div>

        <div id="signup-error-msg" class="admin-auth-error-msg" style="display: none; margin-bottom: 12px;"></div>

        <button type="submit" id="customer-signup-btn" class="btn btn-forest btn-lg" style="width: 100%; justify-content: center; margin-bottom: 16px;">
          <span>Create Account & Continue &rarr;</span>
        </button>
      </form>

      <div class="auth-card-footer">
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 10px;">
          Already have an account? <a href="login.html" class="auth-inline-link">Sign In &rarr;</a>
        </p>
        <p style="font-size: 0.82rem; color: var(--text-muted);">
          Just want to order quickly? <a href="services.html" class="auth-inline-link" style="color: var(--text-body);">Order as Guest</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="./main.js?v=2.3"></script>
</body>
</html>
